plugins {
    id 'java'
    id 'application'
}

group = 'com.rideshare'
version = '1.0.0'
sourceCompatibility = '11'

repositories {
    mavenCentral()
}

dependencies {
    // JUnit 5 for testing
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.9.2'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.9.2'
    testImplementation 'org.junit.jupiter:junit-jupiter-params:5.9.2'

    // Mockito for mocking
    testImplementation 'org.mockito:mockito-core:5.3.1'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.3.1'
}

application {
    mainClass = 'com.rideshare.RideshareDispatchSimulator'
}

test {
    useJUnitPlatform()

    testLogging {
        events "passed", "skipped", "failed"
        exceptionFormat "full"
        showStandardStreams = false
    }
}

jar {
    manifest {
        attributes(
                'Main-Class': 'com.rideshare.RideshareDispatchSimulator',
                'Implementation-Title': 'Rideshare Dispatch Simulator',
                'Implementation-Version': version
        )
    }

    // Create a fat JAR with all dependencies
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }

    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.register('runScenarios', JavaExec) {
    group = 'application'
    description = 'Run all test scenarios'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.rideshare.RideshareDispatchSimulator'
    standardInput = System.in
}

// Task to generate Javadoc
javadoc {
    options.encoding = 'UTF-8'
    options.author = true
    options.version = true
}